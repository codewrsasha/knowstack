
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: knowstack_db
      POSTGRES_USER: knowstack_user
      POSTGRES_PASSWORD: 12345678
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
