<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Knowstack — заметки</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <main class="app">

        <!-- Левая фиолетовая панель -->
        <section class="side_bar">
            <div class="side_bar_top">
                <div class="side_bar_icon test-icon"><a href="./test.html">|||</a></div>
            </div>
            <div class="side_bar_bottom">
                <div class="side_bar_icon settings-icon">+</div>
            </div>
        </section>

        <!-- Колонка со списком заметок -->
        <section class="nav_bar">
            <div class="nav_bar_controls">
                    <input class="nav_bar_input" type="search" placeholder="Поиск вопроса">
                    <button class="nav_bar_search-icon">Поиск</button>
            </div>

            <!-- Панель прокрутки -->
            <div class="navbar__scroll-questions">
                
            </div>
        </section>

        <!-- Область ввода/просмотра заметки -->
        <section class="editor">
            <div class="editor__question">
                <input class="editor__question-input" type="text" placeholder="Введите вопрос">
            </div>
            <div class="editor__answer">
                <textarea class="editor__answer-input" placeholder="Введите ответ"></textarea>
            </div>
            <div class="editor__tags">
                <input class="editor__tags-input" type="text" placeholder="Введите теги разделяя их запятой">                
            </div>
            <div class="editor__tags-type_answer">
                <input type="radio" class="editor__tags-type_answer-input" name="type_answer" value="definition"> Определение
                <input type="radio" class="editor__tags-type_answer-input" name="type_answer" value="list"> Перечисление
                <input type="radio" class="editor__tags-type_answer-input" name="type_answer" value="characteristic"> Характеристика
            </div>
            <div class="editor__save">
                <button class="editor__save-button">Сохранить</button>
                <button class="editor__delete-button">Удалить</button>
            </div>            
        </section>
    </main>
    <script type="module" src="./notes.js"></script>
</body>
</html>
